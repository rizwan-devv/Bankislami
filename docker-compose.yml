# Bank Islami — deploy on Ubuntu host (e.g. 2.28.204.253)
# MySQL lives on ANOTHER server — set MYSQL_HOST in .env
#
# Services:
#   bankislami-backend   :8091  Corporate portal API
#   bankislami-frontend  :8060  Corporate portal UI
#   bankislami-agent-api :8092  Corporate Agent App APIs

services:
  bankislami-backend:
    build: ./corporate-backend
    image: bankislami-backend:latest
    container_name: bankislami-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8091:8091"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bankislami_corporate}
      MYSQL_USER: ${MYSQL_USER:-dfs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-bankislami-corporate-change-me-in-prod-32chars}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://2.28.204.253:8060}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://2.28.204.253:8060,http://localhost:5175}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      DFS_ACCOUNT_API_ENABLED: ${DFS_ACCOUNT_API_ENABLED:-true}
      DFS_ACCOUNT_API_BASE_URL: ${DFS_ACCOUNT_API_BASE_URL:-http://46.225.160.93:18001}
      DFS_PORTAL_API_ENABLED: ${DFS_PORTAL_API_ENABLED:-true}
      CORPORATE_PORTAL_API_KEY: ${CORPORATE_PORTAL_API_KEY:-}
      DFS_TXN_API_BASE_URL: ${DFS_TXN_API_BASE_URL:-http://46.225.160.93:18009/transactions}
      DFS_APP_API_BASE_URL: ${DFS_APP_API_BASE_URL:-http://46.225.160.93:18002/app}
      DFS_PORTAL_API_CHANNEL: ${DFS_PORTAL_API_CHANNEL:-COP}
    volumes:
      - bankislami_uploads:/app/uploads

  bankislami-frontend:
    build:
      context: ./corporate-frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://2.28.204.253:8091}
    image: bankislami-frontend:latest
    container_name: bankislami-frontend
    restart: unless-stopped
    ports:
      - "8060:80"
    depends_on:
      - bankislami-backend

  bankislami-agent-api:
    build: ./agent-api
    image: bankislami-agent-api:latest
    container_name: bankislami-agent-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8092:8092"
    environment:
      PORT: "8092"
      PUBLIC_BASE_URL: ${AGENT_PUBLIC_BASE_URL:-http://2.28.204.253:8092}
      JWT_SECRET: ${AGENT_JWT_SECRET:-CorporateAgentApiDevSecretKeyChangeMe32chars!!}
      DFS_PROXY_ENABLED: ${DFS_PROXY_ENABLED:-false}
      DFS_AGENT_BASE_URL: ${DFS_AGENT_BASE_URL:-http://46.225.160.93:18001}
      DFS_TXN_BASE_URL: ${DFS_TXN_BASE_URL:-http://46.225.160.93:18009}
      DFS_THIRD_PARTY_BASE_URL: ${DFS_THIRD_PARTY_BASE_URL:-http://46.225.160.93:18008}
      DFS_UPSTREAM_BEARER: ${DFS_UPSTREAM_BEARER:-}

volumes:
  bankislami_uploads:
