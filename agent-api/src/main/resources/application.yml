server:
  port: ${PORT:8092}

spring:
  application:
    name: corporate-agent-api

# Public URL the Android app should use (set on deploy).
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8092}
  jwt:
    secret: ${JWT_SECRET:CorporateAgentApiDevSecretKeyChangeMe32chars!!}
    expiry-hours: ${JWT_EXPIRY_HOURS:24}

# Auth & registration are managed HERE; login can auto-provision from DFS when proxy on.
agent:
  wallet-mode: ${AGENT_WALLET_MODE:local}   # local | dfs-proxy
  # Must match DFS wallet level (portal default L4) — wrong level → USER NOT FOUND on getbalance
  account-level-code: ${AGENT_ACCOUNT_LEVEL_CODE:L4}
  # When local user missing: if DFS wallet exists, create agent (no curl register)
  auto-provision-on-login: ${AGENT_AUTO_PROVISION:true}
  # Corporate portal API — CNIC fallback when DFS accountDetails.nidNo is null
  corporate-base-url: ${CORPORATE_BACKEND_URL:http://bankislami-backend:8091}

# Transactions: app → this API → DFS → response back to app
# Default mode=portal: X-Portal-Key + /v1/corporate/* (same as Bank Islami / DFS Corporate portal)
dfs:
  proxy:
    enabled: ${DFS_PROXY_ENABLED:false}
    mode: ${DFS_PROXY_MODE:portal}          # portal | bearer
  portal-key: ${CORPORATE_PORTAL_API_KEY:}
  channel: ${DFS_PORTAL_API_CHANNEL:COP}
  agent-base-url: ${DFS_AGENT_BASE_URL:http://46.225.160.93:18001}
  # App corporate APIs (accountDetails) — used for auto-provision CNIC/title
  app-base-url: ${DFS_APP_API_BASE_URL:http://46.225.160.93:18002/app}
  txn-base-url: ${DFS_TXN_BASE_URL:http://46.225.160.93:18009}
  # Corporate portal txn base (with /transactions). Falls back to txn-base-url + /transactions
  portal-txn-base-url: ${DFS_TXN_API_BASE_URL:http://46.225.160.93:18009/transactions}
  third-party-base-url: ${DFS_THIRD_PARTY_BASE_URL:http://46.225.160.93:18008}
  upstream-bearer: ${DFS_UPSTREAM_BEARER:}
  connect-timeout-ms: 15000
  read-timeout-ms: 45000

logging:
  level:
    com.corporate.agent: INFO
